name: 🛠️ Tarefa
description: Implementação ou trabalho com entregável, DoD verificável, evidência, risco e skill obrigatória.
title: "[tarefa] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Uma issue, um PR.** Se o escopo não cabe em um diff revisável, divida antes de começar.
        O DoD é observável: comando, arquivo, status HTTP ou teste — "funciona" não é critério.

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema / área (vira label `area/*`)
      options:
        - wyd-protocol
        - wyd-net
        - wyd-core
        - wyd-server
        - wyd-sim
        - wyd-db
        - wyd-admin
        - wyd-portal
        - wyd-launcher
        - wyd-client
        - wyd-bots
        - wyd-docs
        - wyd-ops
        - repositório (AGENTS.md, README, GitHub)
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Duas a quatro linhas. Aponte a página que descreve a tarefa.
    validations:
      required: true

  - type: textarea
    id: entregavel
    attributes:
      label: Entregável
      description: O que existe ao final, em arquivo, comando ou artefato.
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Verificável, com comando ou arquivo.
      placeholder: |
        - [ ] `make gate` verde
        - [ ] `cargo test -p wyd-db --lib` verde
        - [ ] página dona atualizada na mesma entrega
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidência de verificação
      description: Como a revisão confere sem abrir o código — saída do comando, link do run e do artefato.
      placeholder: |
        gate: PASS (full, 42.7s)
        run: https://github.com/lucascantarelli/wyd/actions/runs/...
        artefato: resultado-ci / cobertura-wyd-launcher
    validations:
      required: true

  - type: textarea
    id: fora
    attributes:
      label: Fora de escopo
      description: O que não entra neste PR, para não crescer no meio.
    validations:
      required: false

  - type: textarea
    id: depende
    attributes:
      label: Depende de
      description: Issues, lacunas ou decisões. Escreva "nada" quando não houver.
    validations:
      required: true

  - type: checkboxes
    id: riscos
    attributes:
      label: Riscos tocados
      options:
        - label: "🔐 Segurança — permissão, credencial, dependência (`risco/seguranca`)"
        - label: "🗃️ Dados — migration, seed, dado de jogador (`risco/dados`)"
        - label: "🧩 Contrato entre sistemas — protocolo, schema, API"
        - label: "🚀 Operação — imagem, Compose, deploy, rollback"
        - label: "📉 Regressão — comportamento hoje correto"
        - label: "♻️ Refatoração sem mudança de comportamento"

  - type: dropdown
    id: marco
    attributes:
      label: Marco
      options:
        - M0 — Fundação
        - M1 — Planejamento
        - M2 — wyd-db
        - M3 — Sistemas
        - M4 — 1.0.0
        - M5 — Operação
    validations:
      required: true

  - type: dropdown
    id: skill_principal
    attributes:
      label: Skill obrigatória para executar
      description: A lista é fechada e conferida contra a §3 de planejamento-1.0.0/wyd-ops/docs/planos/template-de-issue.md.
      options:
        - auditar-planejamento
        - documentation-writer
        - escrever-migration
        - finishing-a-development-branch
        - frontend-design
        - github-actions-docs
        - implementar-issue
        - planejar-sistema
        - python-testing-patterns
        - revisar-documentacao
        - skill-creator
        - writing-plans
    validations:
      required: true

  - type: textarea
    id: skills_complementares
    attributes:
      label: Skills complementares
      description: Opcional. Nomes da mesma lista fechada, um por linha, com o motivo.
      placeholder: implementar-issue — executar de ponta a ponta; github-actions-docs — mexer no workflow
    validations:
      required: false

  - type: dropdown
    id: mcp
    attributes:
      label: MCP usado na execução
      options:
        - nenhum
        - sequential-thinking
        - server-memory
        - sequential-thinking + server-memory
    validations:
      required: true

  - type: checkboxes
    id: integracoes
    attributes:
      label: Integrações tocadas
      options:
        - label: GitHub (issue, PR, run, release, milestone)
        - label: Slack (`SLACK_CI_WEBHOOK`)
        - label: GHCR / Docker (imagem)
        - label: Nenhuma

  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Confirmações
      options:
        - label: A página que descreve a tarefa está escrita e revisada.
          required: true
        - label: É uma issue por PR, sem refatoração fora do escopo.
          required: true
        - label: O DoD nomeia comando, arquivo ou teste para cada critério.
          required: true
