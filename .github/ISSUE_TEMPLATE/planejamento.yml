name: 🗺️ Planejamento
description: Página ou documento novo em um sistema — com público, pergunta, fonte e critério de aceite.
title: "[planejamento] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        **Escrever antes de codar.** Nenhum arquivo de código nasce antes de a página que o descreve
        estar `aceita`. A página cita o padrão (`wyd-db/docs/convencoes.md`) e não o recopia.

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema / área (vira label `area/*`)
      description: Onde a página vai morar. O sistema dono escreve; o site apenas publica.
      options:
        - wyd-protocol
        - wyd-net
        - wyd-core
        - wyd-server
        - wyd-sim
        - wyd-db
        - wyd-admin
        - wyd-portal
        - wyd-launcher
        - wyd-client
        - wyd-bots
        - wyd-docs
        - wyd-ops
    validations:
      required: true

  - type: input
    id: arquivo
    attributes:
      label: Arquivo previsto
      description: Caminho relativo em `planejamento-1.0.0/<sistema>/docs/`.
      placeholder: docs/arquitetura/visao-geral.md
    validations:
      required: true

  - type: textarea
    id: pergunta
    attributes:
      label: Que pergunta a página responde
      description: Uma pergunta, a mesma do cabeçalho `> Pergunta:`.
    validations:
      required: true

  - type: dropdown
    id: publico
    attributes:
      label: Público
      options:
        - Desenvolvedor novo
        - Desenvolvedor de outro sistema
        - Arquiteto
        - Operação
        - QA
        - Produto / gestão
        - Agente de IA
    validations:
      required: true

  - type: textarea
    id: fonte
    attributes:
      label: Fonte da afirmação
      description: De onde vem cada fato — comando, arquivo, golden, captura ou `H` com o ID da lacuna.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidência de verificação
      description: Como o aceite é provado — gate, build do site, link de página publicada e, quando houver, run/artefato do CI.
      placeholder: |
        - [ ] `make gate-fast` verde
        - [ ] página em /sistemas/wyd-db/...
        - [ ] revisão de quem não escreveu
    validations:
      required: true

  - type: checkboxes
    id: riscos
    attributes:
      label: Riscos do documento
      options:
        - label: "🧪 Afirmação sem `V` — precisa de comando e data ou vira `H` com lacuna"
        - label: "🔁 Duplicação de fato — número/regra que já tem dono em outra página"
        - label: "🏗️ Muda fronteira de sistema — exige decisão registrada"
        - label: "📉 Contagem que o gate confere — precisa de fonte, comando e data"

  - type: dropdown
    id: marco
    attributes:
      label: Marco
      options:
        - M0 — Fundação
        - M1 — Planejamento
        - M2 — wyd-db
        - M3 — Sistemas
        - M4 — 1.0.0
        - M5 — Operação
    validations:
      required: true

  - type: dropdown
    id: skill_principal
    attributes:
      label: Skill obrigatória para executar
      description: A lista é fechada e conferida contra a §3 de planejamento-1.0.0/wyd-ops/docs/planos/template-de-issue.md.
      options:
        - auditar-planejamento
        - documentation-writer
        - escrever-migration
        - finishing-a-development-branch
        - frontend-design
        - github-actions-docs
        - implementar-issue
        - planejar-sistema
        - python-testing-patterns
        - revisar-documentacao
        - skill-creator
        - writing-plans
    validations:
      required: true

  - type: textarea
    id: skills_complementares
    attributes:
      label: Skills complementares
      description: Opcional. Nomes da mesma lista fechada, um por linha, com o motivo.
      placeholder: documentation-writer — reescrever a página; auditar-planejamento — revisar contagem
    validations:
      required: false

  - type: dropdown
    id: mcp
    attributes:
      label: MCP usado na análise
      options:
        - nenhum
        - sequential-thinking
        - server-memory
        - sequential-thinking + server-memory
    validations:
      required: true

  - type: checkboxes
    id: integracoes
    attributes:
      label: Integrações tocadas
      options:
        - label: GitHub (issue, PR, milestone)
        - label: Site publicado (MkDocs / Pages)
        - label: Slack (`SLACK_CI_WEBHOOK`)
        - label: Nenhuma

  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Confirmações
      options:
        - label: A página está prevista na árvore do plano diretor do sistema.
          required: true
        - label: O conteúdo não é cópia de `deprecated/`.
          required: true
        - label: Cada afirmação tem `V` (com data) ou `H` com o ID da lacuna.
          required: true
