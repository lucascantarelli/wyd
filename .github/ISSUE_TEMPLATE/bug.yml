name: 🐞 Defeito
description: Algo no repositório está errado — documento, site, script de build ou código — com reprodução e evidência.
title: "[defeito] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Antes de abrir:** defeito exige reprodução e evidência. Sem os dois, é dúvida — abra discussão, não defeito.
        Nunca cole segredo, DSN, token, hash de jogador ou dado de cliente.

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema / área (vira label `area/*`)
      description: Qual sistema é dono do defeito? O workflow de metadados aplica a label `area/<sistema>`.
      options:
        - wyd-protocol
        - wyd-net
        - wyd-core
        - wyd-server
        - wyd-sim
        - wyd-db
        - wyd-admin
        - wyd-portal
        - wyd-launcher
        - wyd-client
        - wyd-bots
        - wyd-docs
        - wyd-ops
        - repositório (AGENTS.md, README, GitHub)
    validations:
      required: true

  - type: dropdown
    id: gravidade
    attributes:
      label: Gravidade
      description: Impacto real, não sensação. Bloqueia alguém hoje?
      options:
        - "🔴 Bloqueia — impede trabalho ou corrompe dado"
        - "🟠 Alto — resultado errado com contorno caro"
        - "🟡 Médio — resultado errado com contorno simples"
        - "🔵 Baixo — ruído, texto, estilo"
    validations:
      required: true

  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
      description: Comportamento observado, com caminho de arquivo, linha ou URL.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
      description: Aponte o documento dono ou a regra violada (AGENTS.md, convenções, ADR).
    validations:
      required: true

  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Comando exato ou passos numerados. "Às vezes" não é reprodução.
      placeholder: |
        1. cd wyd-docs
        2. py -3 preparar.py
        3. py -3 -m gate fast --root ..
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidência de verificação
      description: Saída do comando, trecho com linha, link de run/artefato do CI ou captura. É o que o gate e a revisão leem.
      placeholder: |
        $ py -3 -m gate fast --root ..
        gate: FAIL (fast, 12.3s)
        layout FAIL: ...
        Run: https://github.com/lucascantarelli/wyd/actions/runs/...
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Impacto
      description: Quem é afetado, o que fica bloqueado e o que piora se não for corrigido.
    validations:
      required: true

  - type: checkboxes
    id: riscos
    attributes:
      label: Riscos tocados
      description: Marque o que a correção pode mexer.
      options:
        - label: "🔐 Segurança — credencial, permissão, dependência vulnerável (`risco/seguranca`)"
        - label: "🗃️ Dados — migration, seed, dado real de jogador (`risco/dados`)"
        - label: "🧩 Contrato entre sistemas — protocolo, schema, API"
        - label: "📉 Regressão — comportamento hoje correto que pode quebrar"

  - type: dropdown
    id: marco
    attributes:
      label: Marco
      options:
        - M0 — Fundação
        - M1 — Planejamento
        - M2 — wyd-db
        - M3 — Sistemas
        - M4 — 1.0.0
        - M5 — Operação
    validations:
      required: true

  - type: dropdown
    id: skill_principal
    attributes:
      label: Skill obrigatória para executar
      description: A lista é fechada e conferida contra a §3 de planejamento-1.0.0/wyd-ops/docs/planos/template-de-issue.md.
      options:
        - auditar-planejamento
        - documentation-writer
        - escrever-migration
        - finishing-a-development-branch
        - frontend-design
        - github-actions-docs
        - implementar-issue
        - planejar-sistema
        - python-testing-patterns
        - revisar-documentacao
        - skill-creator
        - writing-plans
    validations:
      required: true

  - type: textarea
    id: skills_complementares
    attributes:
      label: Skills complementares
      description: Opcional. Nomes da mesma lista fechada, um por linha, com o motivo.
      placeholder: revisar-documentacao — conferir o cabeçalho da página dona
    validations:
      required: false

  - type: dropdown
    id: mcp
    attributes:
      label: MCP usado na investigação
      description: Servidor MCP que ajudou a achar ou provar o defeito.
      options:
        - nenhum
        - sequential-thinking
        - server-memory
        - sequential-thinking + server-memory
    validations:
      required: true

  - type: checkboxes
    id: integracoes
    attributes:
      label: Integrações tocadas
      options:
        - label: GitHub (issue, PR, run, release, milestone)
        - label: Slack (`SLACK_CI_WEBHOOK`)
        - label: GHCR / Docker (imagem)
        - label: Nenhuma

  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Antes de abrir
      options:
        - label: Li o `AGENTS.md` e o documento do sistema dono.
          required: true
        - label: A reprodução e a evidência estão no corpo, não em anexo privado.
          required: true
        - label: Não incluí segredo, DSN, token ou dado de jogador.
          required: true
        - label: Procurei defeito igual aberto antes de criar outro.
          required: true
