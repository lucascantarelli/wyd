name: docs-check
description: Instala as dependências do site e executa o gate único de documentação.

inputs:
  python:
    description: Executável do Python com as dependências instaladas.
    required: false
    default: python

runs:
  using: composite
  steps:
    - name: Instalar dependências do site
      shell: bash
      run: |
        "${{ inputs.python }}" -m pip install --disable-pip-version-check -r wyd-docs/requirements.txt

    # O comando mora em um script só; o Compose chama o mesmo arquivo.
    - name: Gate de documentação
      shell: bash
      run: bash wyd-docs/gate.sh "$GITHUB_WORKSPACE"
