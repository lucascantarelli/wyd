name: imagem
description: Buildx com cache de layers no GHA, push opcional no GHCR e fumaça HTTP opcional — a mesma sequência para todo projeto com Dockerfile.

inputs:
  nome:
    description: Referência da imagem sem tag (ex. ghcr.io/dono/wyd-server).
    required: true
  dockerfile:
    description: Caminho do Dockerfile, relativo à raiz do repositório.
    required: true
  tags:
    description: Lista de tags (uma por linha) aplicadas ao build.
    required: true
  publicar:
    description: Use true para empurrar a imagem ao GHCR; false carrega só no runner para a fumaça.
    required: false
    default: "false"
  cache-scope:
    description: Escopo do cache GHA, um por imagem.
    required: true
  contexto:
    description: Contexto de build.
    required: false
    default: "."
  smoke-porta:
    description: Porta HTTP para a fumaça; vazio desliga a fumaça.
    required: false
    default: ""
  smoke-caminho:
    description: Caminho conferido na fumaça.
    required: false
    default: "/"

runs:
  using: composite
  steps:
    - name: Preparar Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Login e push usam o token do próprio job: nenhuma credencial de terceiro.
    - name: Login no GHCR
      if: inputs.publicar == 'true'
      shell: bash
      env:
        GHCR_TOKEN: ${{ github.token }}
      run: |
        set -eu
        echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

    - name: Construir imagem
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.contexto }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.publicar == 'true' }}
        load: ${{ inputs.publicar != 'true' }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: ${{ inputs.publicar == 'true' && format('type=gha,mode=max,scope={0}', inputs.cache-scope) || '' }}
        provenance: ${{ inputs.publicar == 'true' }}
        sbom: ${{ inputs.publicar == 'true' }}

    - name: Fumaça HTTP
      if: inputs.smoke-porta != ''
      shell: bash
      env:
        NOME: ${{ inputs.nome }}
        PORTA: ${{ inputs.smoke-porta }}
        CAMINHO: ${{ inputs.smoke-caminho }}
        PUBLICAR: ${{ inputs.publicar }}
      run: |
        set -eu
        ref="${NOME}:${GITHUB_SHA}"
        if [ "$PUBLICAR" = "true" ]; then
          docker pull "$ref"
        fi
        docker run --detach --name imagem-smoke --publish "8123:${PORTA}" "$ref"
        codigo=0
        for _ in $(seq 1 30); do
          if curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:8123${CAMINHO}"; then
            codigo=1
            break
          fi
          sleep 1
        done
        docker logs imagem-smoke || true
        docker rm --force imagem-smoke || true
        if [ "$codigo" != "1" ]; then
          echo "${NOME} não respondeu 200 em ${CAMINHO} dentro de 30 s" >&2
          exit 1
        fi
