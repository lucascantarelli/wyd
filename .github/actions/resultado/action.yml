name: resultado
description: Relatório único do run — veredito, tempo de pipeline, consumo de runner, DORA e cobertura — no summary, no log, em artefato e no Slack. A lógica mora em `wyd-ops/scripts/notificacao/`; esta action só orquestra.

inputs:
  workflow:
    description: Nome do workflow que gerou o run.
    required: true

runs:
  using: composite
  steps:
    # Cola fina de propósito: permissão, env e ordem ficam aqui; cálculo e texto
    # ficam em `wyd-ops/scripts/notificacao/`, cobertos por `node --test`.
    # Sem o script o job falha alto — aviso ausente não pode passar por sucesso.
    - name: Relatório do run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        set -euo pipefail
        script="${GITHUB_WORKSPACE}/wyd-ops/scripts/notificacao/cli.mjs"
        if [ ! -f "$script" ]; then
          echo "::error::relatório: ${script} não existe; o aviso não é gerado e o job falha"
          exit 1
        fi
        node --check "$script"
        node "$script"

    - name: Publicar o resumo como artefato
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: resultado-${{ inputs.workflow }}
        path: ${{ runner.temp }}/resumo.md
        retention-days: 14
        if-no-files-found: warn
