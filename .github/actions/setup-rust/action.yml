name: setup-rust
description: Instala a toolchain pinada em rust-toolchain.toml e restaura o cache do crate.

inputs:
  crate:
    description: Crate cujo target será cacheado (wyd-db, wyd-ops-signer ou wyd-launcher).
    required: true

runs:
  using: composite
  steps:
    # A versão também está em rust-toolchain.toml; o input explícito garante que
    # o job não dependa do toolchain pré-instalado no runner.
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: "1.100.0"
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      with:
        workspaces: crates/${{ inputs.crate }} -> target
        cache-on-failure: false
