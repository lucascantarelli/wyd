name: setup-rust
description: Instala a toolchain padrão (ou a informada) e restaura o cache do crate.

inputs:
  crate:
    description: Crate cujo target será cacheado (wyd-db, wyd-ops-signer ou wyd-launcher).
    required: true
  toolchain:
    description: Toolchain Rust; o padrão acompanha rust-toolchain.toml.
    required: false
    default: "1.100.0"

runs:
  using: composite
  steps:
    # A versão padrão também está em rust-toolchain.toml; o input explícito garante
    # que o job não dependa do toolchain pré-instalado no runner. O job noturno
    # passa `stable` para antecipar quebra sem alterar o gate do PR.
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt, clippy

    # O SHA é o commit da tag v2.9.3 (não o objeto da tag anotada).
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: crates/${{ inputs.crate }} -> target
        cache-on-failure: false
