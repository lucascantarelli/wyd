name: notify-failure
description: Resumo da falha no run e aviso no Slack, se SLACK_WEBHOOK_URL existir.

inputs:
  workflow:
    description: Nome do workflow que falhou.
    required: true

runs:
  using: composite
  steps:
    - name: Resumo do run
      shell: bash
      run: |
        {
          echo "### Falha em ${{ inputs.workflow }}"
          echo ""
          echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "- Commit: \`${GITHUB_SHA}\`"
          echo "- Ref: \`${GITHUB_REF}\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Aviso no Slack
      shell: bash
      # O job que chama a action define SLACK_WEBHOOK_URL a partir do secret.
      # Sem o secret, o step não falha: o alerta é opcional, o gate não.
      run: |
        if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
          echo "SLACK_WEBHOOK_URL ausente; aviso no Slack ignorado."
          exit 0
        fi
        texto="Falha em ${{ inputs.workflow }} (${GITHUB_REPOSITORY}) — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        payload="$(jq -n --arg texto "$texto" '{text: $texto}')"
        curl --fail --silent --show-error \
          --request POST \
          --header 'Content-Type: application/json' \
          --data "$payload" \
          "$SLACK_WEBHOOK_URL"
