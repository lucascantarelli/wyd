name: code-stable

# Sinal de atualização, não gate de PR. O projeto fixa Rust 1.100.0 em
# `rust-toolchain.toml`; este workflow roda a mesma suíte com `stable` uma vez por dia
# para descobrir cedo o que a próxima toolchain vai quebrar. Falha aqui não bloqueia merge.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-stable-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  stable:
    name: stable / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: wyd-db
            args: --lib --test contrato_api_migrate --test contrato_api_provision
          - crate: wyd-ops-signer
            args: --locked
          # O launcher tem comportamento e roda em Linux no `code.yml`; faltava no
          # sinal diário, que só olhava os dois crates do banco e do assinador.
          - crate: wyd-launcher
            args: --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: ${{ matrix.crate }}
          toolchain: stable
      - name: Testes com stable
        run: cargo test --manifest-path crates/${{ matrix.crate }}/Cargo.toml ${{ matrix.args }}

  # O sinal diário só serve se alguém ficar sabendo: sem este job, a quebra
  # antecipada da próxima toolchain morre no run agendado.
  notify:
    name: notificar falha
    if: always() && (failure() || cancelled())
    needs: [stable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-failure
        with:
          workflow: code-stable
