name: security-semanal

# O advisory envelhece sem commit, então o `security` também roda por agenda. Agenda é
# outro evento: este workflow é o run, chama o domínio como reusable e avisa uma vez.
# O `ci.yml` cobre push e pull_request e tem o seu próprio aviso único.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-semanal
  cancel-in-progress: false

jobs:
  security:
    name: security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: write

  notificar:
    name: notificar resultado
    if: always()
    needs: [security]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resultado
        with:
          workflow: security-semanal
