name: security

# Advisory, licença, dependência vulnerável e política de pin. Roda em todo PR
# (é check obrigatório) e semanalmente, porque o advisory envelhece sem commit.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analise:
    name: audit e deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: wyd-db
      - name: Instalar cargo-audit e cargo-deny
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (cada lockfile)
        run: |
          set -euo pipefail
          for lock in crates/*/Cargo.lock; do
            echo "== $lock"
            cargo audit --file "$lock"
          done
      - name: cargo deny (cada crate)
        run: |
          set -euo pipefail
          for manifest in crates/*/Cargo.toml; do
            echo "== $manifest"
            cargo deny --config wyd-ops/deny.toml --manifest-path "$manifest" check advisories bans licenses sources
          done

  # O portal é Next.js com lockfile versionado e não passava por nenhum job: uma
  # dependência vulnerável ali só apareceria na máquina de quem rodasse `npm audit`.
  portal:
    name: dependências do portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wyd-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node do runner
        run: node --version
      - name: npm audit (produção)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (completo, informativo)
        run: npm audit --audit-level=high || true

  # Regra que o actionlint não cobre: action por SHA de 40 hex e imagem de terceiro
  # por digest. Roda em todo PR para não deixar passar referência móvel.
  pinos:
    name: política de pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir actions e imagens
        run: bash wyd-ops/scripts/ci/check-pins.sh "$GITHUB_WORKSPACE"

  dependency-review:
    name: revisão de dependência
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  workflow-lint:
    name: lint de workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/*.yml

  gate-security:
    name: gate-security
    if: always()
    needs: [analise, portal, pinos, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `dependency-review` só existe em pull_request: o agregado o ignora em push e
      # em schedule, que é o comportamento que o laço antigo tinha à mão.
      - uses: ./.github/actions/gate-agregado
        with:
          jobs: analise=${{ needs.analise.result }} portal=${{ needs.portal.result }} pinos=${{ needs.pinos.result }} dependency-review=${{ needs.dependency-review.result }} workflow-lint=${{ needs.workflow-lint.result }}
          evento: ${{ github.event_name }}
          condicional: dependency-review
