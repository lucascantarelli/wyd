name: code

# Um workflow por domínio. Este cobre fmt, clippy, testes e cobertura dos três
# crates — lint e teste no mesmo job por crate, para reaproveitar o `target/`; os
# alvos PostgreSQL ficam em `ci-db.yml` e a segurança em `security.yml`.
# `wyd-db` e `wyd-ops-signer` rodam em Linux/Windows; o núcleo do `wyd-launcher` é
# Rust puro (sem Tauri nem `cfg(windows)`) e roda em Linux. O empacotamento NSIS do
# launcher, quando existir, é o único passo que exige Windows.
# O check obrigatório é `gate-code`, não cada job da matriz: assim a matriz pode
# crescer sem mudar a regra de branch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt / ${{ matrix.crate }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: wyd-db
            os: ubuntu-latest
          - crate: wyd-ops-signer
            os: ubuntu-latest
          # Núcleo portátil: formatação do launcher roda em Linux como os demais.
          - crate: wyd-launcher
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: ${{ matrix.crate }}
      - name: Formatação
        run: cargo fmt --manifest-path crates/${{ matrix.crate }}/Cargo.toml -- --check

  # Lint e teste no mesmo job: o `target/` de um crate vale para os dois passos,
  # então as dependências são compiladas uma vez.
  verify:
    name: clippy+unit / ${{ matrix.crate }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: wyd-db
            os: ubuntu-latest
            # A lib e os contratos públicos de `migrate`/`provision`; os alvos
            # PostgreSQL ficam em `ci-db.yml` e não rodam aqui.
            args: --lib --test contrato_migrations --test contrato_api_migrate --test contrato_api_provision
          - crate: wyd-ops-signer
            os: ubuntu-latest
            args: --locked
          - crate: wyd-ops-signer
            os: windows-latest
            args: --locked
          # Núcleo portátil: lint e teste do launcher rodam em Linux. O bundle
          # NSIS (Tauri) será job próprio em Windows, quando existir.
          - crate: wyd-launcher
            os: ubuntu-latest
            args: --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/testes-rust
        with:
          crate: ${{ matrix.crate }}
          args: ${{ matrix.args }}

  # Esqueleto dos sistemas que ainda não têm comportamento. `fmt: true` porque este
  # job é o único que cobre formatação desses crates.
  esqueleto:
    name: esqueleto / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate:
          - wyd-protocol
          - wyd-net
          - wyd-core
          - wyd-sim
          - wyd-server
          - wyd-admin
          - wyd-bots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/testes-rust
        with:
          crate: ${{ matrix.crate }}
          args: --locked
          fmt: "true"

  # `wyd-db` continua informativo (decisão D-02 = B); o `wyd-launcher` aplica o piso
  # de 85% de linha que o plano dele promete (wyd-launcher/docs/planos/plano-de-testes.md
  # §Cobertura). O `--fail-under-lines` vale só no passo de resumo; o LCOV é sempre
  # gerado para o artefato.
  coverage:
    name: cobertura / ${{ matrix.crate }}
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: wyd-db
            args: --lib
            piso: ""
          - crate: wyd-launcher
            args: ""
            piso: --fail-under-lines 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: ${{ matrix.crate }}
      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-llvm-cov
      - name: Cobertura
        run: |
          set -o pipefail
          rustup component add llvm-tools-preview
          cargo llvm-cov --manifest-path crates/${{ matrix.crate }}/Cargo.toml ${{ matrix.args }} --summary-only ${{ matrix.piso }} | tee coverage-summary.txt
          cargo llvm-cov --manifest-path crates/${{ matrix.crate }}/Cargo.toml ${{ matrix.args }} --lcov --output-path lcov.info
      - name: Publicar resumo e LCOV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-${{ matrix.crate }}
          path: |
            coverage-summary.txt
            lcov.info
          retention-days: 7
          if-no-files-found: error

  gate-code:
    name: gate-code
    if: always()
    needs: [fmt, verify, esqueleto, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate-agregado
        with:
          jobs: fmt=${{ needs.fmt.result }} verify=${{ needs.verify.result }} esqueleto=${{ needs.esqueleto.result }} coverage=${{ needs.coverage.result }}
