name: code

# Um workflow por domínio. Este cobre fmt, clippy, testes e cobertura dos três
# crates; os alvos PostgreSQL ficam em `ci-db.yml` e a segurança em `security.yml`.
# O check obrigatório é `gate-code`, não cada job da matriz: assim a matriz pode
# crescer sem mudar a regra de branch.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-code-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate: [wyd-db, wyd-ops-signer, wyd-launcher]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: ${{ matrix.crate }}
      - name: Formatação
        run: cargo fmt --manifest-path crates/${{ matrix.crate }}/Cargo.toml -- --check

  clippy:
    name: clippy / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [wyd-db, wyd-ops-signer, wyd-launcher]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: ${{ matrix.crate }}
      - name: Lint
        run: cargo clippy --manifest-path crates/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings

  unit:
    name: unit / ${{ matrix.crate }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: wyd-db
            os: ubuntu-latest
            args: --lib
          - crate: wyd-ops-signer
            os: ubuntu-latest
            args: --locked
          - crate: wyd-ops-signer
            os: windows-latest
            args: --locked
          - crate: wyd-launcher
            os: ubuntu-latest
            args: --locked
          - crate: wyd-launcher
            os: windows-latest
            args: --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: ${{ matrix.crate }}
      - name: Testes
        run: cargo test --manifest-path crates/${{ matrix.crate }}/Cargo.toml ${{ matrix.args }}

  coverage:
    name: cobertura informativa (wyd-db)
    needs: unit
    if: needs.unit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: wyd-db
      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-llvm-cov
      - name: Cobertura (sem --fail-under, decisão D-02 = B)
        run: |
          set -o pipefail
          rustup component add llvm-tools-preview
          cargo llvm-cov --manifest-path crates/wyd-db/Cargo.toml --lib --summary-only | tee coverage-summary.txt
          cargo llvm-cov --manifest-path crates/wyd-db/Cargo.toml --lib --lcov --output-path lcov.info
      - name: Publicar resumo e LCOV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-wyd-db
          path: |
            coverage-summary.txt
            lcov.info
          retention-days: 7
          if-no-files-found: error

  gate-code:
    name: gate-code
    if: always()
    needs: [fmt, clippy, unit, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FMT: ${{ needs.fmt.result }}
      CLIPPY: ${{ needs.clippy.result }}
      UNIT: ${{ needs.unit.result }}
      COVERAGE: ${{ needs.coverage.result }}
    steps:
      - name: Agregar os jobs
        run: |
          falhou=0
          for resultado in "$FMT" "$CLIPPY" "$UNIT" "$COVERAGE"; do
            if [ "$resultado" != "success" ]; then
              echo "::error::job com resultado '$resultado'"
              falhou=1
            fi
          done
          exit "$falhou"

  notify:
    name: notificar falha
    if: always() && (failure() || cancelled())
    needs: [gate-code]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-failure
        with:
          workflow: code
