name: docs

on:
  push:
    branches: [develop, main]
    paths:
      - "planejamento-1.0.0/**/docs/**"
      - "planejamento-1.0.0/wyd-1.0.0.md"
      - "AGENTS.md"
      - "wyd-docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/docs-check/**"
  pull_request:
    paths:
      - "planejamento-1.0.0/**/docs/**"
      - "planejamento-1.0.0/wyd-1.0.0.md"
      - "AGENTS.md"
      - "wyd-docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/docs-check/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: build e verificação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: wyd-docs/requirements.txt
      - name: Gate do site
        uses: ./.github/actions/docs-check
      - name: Guardar artefato
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: wyd-docs/site

  publicar:
    name: publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
