name: docs

on:
  # Sem filtro de caminho: este check é obrigatório na proteção de branch e um
  # check filtrado por caminho fica "Expected" em PR que não toca docs. O gate
  # custa segundos; o bloqueio eterno custa mais.
  push:
    # O job `publicar` só roda em push de `develop`; o ambiente `github-pages`
    # recusa outras refs. PR de feature continua verificando pelo evento `pull_request`.
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: gate-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: wyd-docs/requirements.txt
      - name: Gate do site (inclui testes dos verificadores)
        uses: ./.github/actions/docs-check
      - name: Guardar artefato
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: wyd-docs/site

  publicar:
    name: publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    name: notificar resultado
    if: always()
    needs: [verificar, publicar]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resultado
        with:
          workflow: docs
