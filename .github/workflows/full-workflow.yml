name: Full Workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Sentinela semanal: advisory/cobertura envelhecem sem commit nenhum (DEVOPS-08).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # `notify` lê `/actions/runs/<id>/jobs` para publicar o tempo real de cada job.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
    get-info:
        name: Get Info
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.get-version.outputs.version }}
            commit: ${{ steps.get-commit.outputs.commit }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Get version
              id: get-version
              # Proveniência honesta: `vX.Y.Z` quando é tag, senão `0.0.0-<sha>`. O commit é sempre o do run.
              run: echo "version=$(${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-{0}', github.sha) }})" >> $GITHUB_OUTPUT

            - name: Get commit
              id: get-commit
              run: echo "commit=$(${{ github.sha }})" >> $GITHUB_OUTPUT
