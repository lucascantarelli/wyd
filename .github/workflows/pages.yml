name: pages

# Publicação do site no GitHub Pages. Mora em workflow próprio porque o job só
# existe em push de `develop` e em dispatch: dentro do `ci.yml` ele aparecia como
# "pulado" em todo pull request, sem provar nada sobre o PR.
#
# O `gate-docs` continua no `ci.yml` e segue sendo o check obrigatório. O gate
# roda de novo aqui porque o `deploy-pages` só aceita artefato do próprio run:
# `upload-pages-artifact` de outro workflow não é consumível.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Push novo cancela publicação antiga: o site tem de servir o commit mais
# recente, não o penúltimo que terminou depois.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    name: publicar no GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: wyd-docs/requirements.txt
      - name: Gate do site (inclui testes dos verificadores)
        uses: ./.github/actions/docs-check
      - name: Guardar artefato
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: wyd-docs/site
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
