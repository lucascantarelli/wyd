name: docs-image

# Constrói a imagem do site e a publica no GHCR. O `docker compose` do repositório consome
# essa imagem. Login e push usam GITHUB_TOKEN: nenhuma action de terceiro além das oficiais
# `docker/*`, auditadas e pinadas por commit. O gate editorial continua em `docs.yml`.
#
# O build mora na action `imagem`, compartilhada com `imagens-servico.yml`; aqui ficam só
# o gatilho por caminho e as tags desta imagem.
#
# `develop` é a única branch que publica enquanto `main` permanece arquivada (ADR-OPS-0012).
# A tag `latest` acompanha `develop`; no release 1.0.0 a política migra para `main`.

on:
  push:
    branches: [develop]
    paths:
      - "planejamento-1.0.0/**"
      - "wyd-docs/**"
      - "wyd-ops/wyd-docs.Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docs-image.yml"
      - ".github/actions/imagem/**"
  pull_request:
    paths:
      - "planejamento-1.0.0/**"
      - "wyd-docs/**"
      - "wyd-ops/wyd-docs.Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docs-image.yml"
      - ".github/actions/imagem/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wyd-docs
  PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}

jobs:
  imagem:
    name: construir e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/imagem
        with:
          nome: ${{ env.IMAGE }}
          dockerfile: wyd-ops/wyd-docs.Dockerfile
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:latest
          publicar: ${{ env.PUBLISH_IMAGE }}
          cache-scope: docs-image
          smoke-porta: "8000"
          smoke-caminho: /

  notify:
    name: notificar resultado
    if: always()
    needs: [imagem]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resultado
        with:
          workflow: docs-image
