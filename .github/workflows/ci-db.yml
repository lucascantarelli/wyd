name: ci-db

# Alvos PostgreSQL em matriz. Os três modos usam o mesmo `postgres:17` por digest como
# service container e compartilham os scripts de preparação; o que muda é o papel,
# a série aplicada e o alvo de teste.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-db-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGPASSWORD: test
  PGDATABASE: wyd

jobs:
  pg:
    name: pg / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: schema
            test: sistema_pg
            roles: nologin
            series: true
            user: postgres
            url: postgres://postgres:test@127.0.0.1:5432/wyd
          - mode: reversibility
            test: reversibilidade_pg
            roles: nologin
            series: false
            user: postgres
            url: postgres://postgres:test@127.0.0.1:5432/wyd
          - mode: runner
            test: runner_pg
            roles: migrator
            series: false
            user: wyd_migrator
            url: postgres://wyd_migrator:test@127.0.0.1:5432/wyd
    services:
      postgres:
        image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wyd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wyd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: wyd-db

      - name: Garantir o psql no runner
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi

      # A criação sempre conecta como `postgres`; o papel de teste só é usado
      # depois que existe.
      - name: Criar papéis
        env:
          PGUSER: postgres
        run: bash scripts/ci/db-prepare.sh "${{ matrix.roles }}"

      - name: Aplicar a série
        if: matrix.series
        env:
          PGUSER: postgres
        run: bash scripts/ci/apply-series.sh "$GITHUB_WORKSPACE"

      - name: Executar o alvo
        env:
          PGUSER: ${{ matrix.user }}
          WYD_DB_TEST_URL: ${{ matrix.url }}
          WYD_DB_TEST_USER: ${{ matrix.user }}
          WYD_DB_TEST_DB: wyd
        run: cargo test --manifest-path crates/wyd-db/Cargo.toml --test ${{ matrix.test }} -- --test-threads=1

  gate-db:
    name: gate-db
    if: always()
    needs: [pg]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Agregar a matriz
        env:
          RESULTADO: ${{ needs.pg.result }}
        run: |
          if [ "$RESULTADO" != "success" ]; then
            echo "::error::alvos PostgreSQL terminaram com '$RESULTADO'"
            exit 1
          fi

  notify:
    name: notificar falha
    if: always() && (failure() || cancelled())
    needs: [gate-db]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-failure
        with:
          workflow: ci-db
