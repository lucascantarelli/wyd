name: ci-db

# Alvos PostgreSQL em matriz. Os três modos usam o mesmo `postgres:17` por digest como
# service container; o que muda é o papel, a série aplicada e o alvo de teste, tudo
# passado para a action `testes-pg`. O service container fica aqui, porque action
# composta não declara `services`.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-db-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGPASSWORD: test
  PGDATABASE: wyd

jobs:
  pg:
    name: pg / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: schema
            alvo: sistema_pg
            papeis: nologin
            serie: true
            usuario: postgres
            url: postgres://postgres:test@127.0.0.1:5432/wyd
          - mode: reversibility
            alvo: reversibilidade_pg
            papeis: nologin
            serie: false
            usuario: postgres
            url: postgres://postgres:test@127.0.0.1:5432/wyd
          - mode: runner
            alvo: runner_pg
            papeis: migrator
            serie: false
            usuario: wyd_migrator
            url: postgres://wyd_migrator:test@127.0.0.1:5432/wyd
    services:
      postgres:
        image: postgres:17@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wyd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wyd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: wyd-db
      - uses: ./.github/actions/testes-pg
        with:
          alvo: ${{ matrix.alvo }}
          url: ${{ matrix.url }}
          papeis: ${{ matrix.papeis }}
          serie: ${{ matrix.serie }}
          usuario: ${{ matrix.usuario }}

  gate-db:
    name: gate-db
    if: always()
    needs: [pg]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate-agregado
        with:
          jobs: pg=${{ needs.pg.result }}

  notify:
    name: notificar resultado
    if: always()
    needs: [gate-db]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resultado
        with:
          workflow: ci-db
