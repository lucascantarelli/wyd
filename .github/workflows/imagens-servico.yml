name: imagens-servico

# Imagens dos serviços que já têm Dockerfile. A action `imagem` faz buildx + cache de
# layers + push + fumaça; aqui ficam matriz e política de tag.
#
# Política de branch (ADR-OPS-0012): `main` está arquivada e não há deploy em tag. Por
# isso `:dev` e `:sha` são publicadas só em push de `develop`; PR constrói e faz fumaça
# sem empurrar nada. `latest` é exclusiva do site (`docs-image.yml`) — imagem de serviço
# não recebe `latest` fora de release.
#
# Sem filtro de caminho, de propósito: estas imagens nunca foram construídas no CI e o
# Dockerfile quebrado só aparece quando alguém builda. O custo é um build por PR, em
# matriz paralela; o benefício é o Dockerfile testado em todo commit.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRO: ghcr.io/${{ github.repository_owner }}
  PUBLICAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}

jobs:
  imagem:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: wyd-server
            dockerfile: wyd-ops/wyd-server.Dockerfile
            porta: "7100"
            caminho: /health
            escopo: wyd-server
          - nome: wyd-admin
            dockerfile: wyd-ops/wyd-admin.Dockerfile
            porta: "7600"
            caminho: /health
            escopo: wyd-admin
          - nome: wyd-portal
            dockerfile: wyd-ops/wyd-portal.Dockerfile
            porta: "3000"
            caminho: /
            escopo: wyd-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/imagem
        with:
          nome: ${{ env.REGISTRO }}/${{ matrix.nome }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ env.REGISTRO }}/${{ matrix.nome }}:${{ github.sha }}
            ${{ env.REGISTRO }}/${{ matrix.nome }}:dev
          publicar: ${{ env.PUBLICAR }}
          cache-scope: ${{ matrix.escopo }}
          smoke-porta: ${{ matrix.porta }}
          smoke-caminho: ${{ matrix.caminho }}
