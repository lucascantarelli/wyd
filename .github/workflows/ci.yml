name: ci

# Um run por evento, um aviso no fim.
#
# Todo o pipeline de PR/push fica neste arquivo, com estágios ligados por `needs`. Os
# jobs são planos de propósito: reusable workflow renomeia o check para
# `code / gate-code`, e o ruleset de `develop` exige os nomes exatos `gate-code`,
# `gate-db`, `gate-docs` e `gate-security`. Só existe um job de aviso por run, e ele é o
# último estágio: lê a lista inteira de jobs pela API e publica uma notificação só.
#
# A agenda semanal roda o mesmo arquivo: o advisory envelhece sem commit, e o run
# agendado reaproveita os mesmos gates em vez de duplicar jobs num segundo workflow.

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGPASSWORD: test
  PGDATABASE: wyd
  IMAGE: ghcr.io/${{ github.repository_owner }}/wyd-docs
  PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
  REGISTRO: ghcr.io/${{ github.repository_owner }}
  PUBLICAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}

jobs:
  fmt:
    name: fmt / ${{ matrix.crate }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: wyd-db
            os: ubuntu-latest
          - crate: wyd-ops-signer
            os: ubuntu-latest
          # Núcleo portátil: formatação do launcher roda em Linux como os demais.
          - crate: wyd-launcher
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: ${{ matrix.crate }}
      - name: Formatação
        run: cargo fmt --manifest-path crates/${{ matrix.crate }}/Cargo.toml -- --check

  # Lint e teste no mesmo job: o `target/` de um crate vale para os dois passos,
  # então as dependências são compiladas uma vez.
  verify:
    name: clippy+unit / ${{ matrix.crate }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: wyd-db
            os: ubuntu-latest
            # A lib e os contratos públicos de `migrate`/`provision`; os alvos
            # PostgreSQL ficam em `ci-db.yml` e não rodam aqui.
            args: --lib --test contrato_migrations --test contrato_api_migrate --test contrato_api_provision
          - crate: wyd-ops-signer
            os: ubuntu-latest
            args: --locked
          - crate: wyd-ops-signer
            os: windows-latest
            args: --locked
          # Núcleo portátil: lint e teste do launcher rodam em Linux. O bundle
          # NSIS (Tauri) será job próprio em Windows, quando existir.
          - crate: wyd-launcher
            os: ubuntu-latest
            args: --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/testes-rust
        with:
          crate: ${{ matrix.crate }}
          args: ${{ matrix.args }}

  # Esqueleto dos sistemas que ainda não têm comportamento. `fmt: true` porque este
  # job é o único que cobre formatação desses crates.
  esqueleto:
    name: esqueleto / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate:
          - wyd-protocol
          - wyd-net
          - wyd-core
          - wyd-sim
          - wyd-server
          - wyd-admin
          - wyd-bots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/testes-rust
        with:
          crate: ${{ matrix.crate }}
          args: --locked
          fmt: "true"

  # `wyd-db` continua informativo (decisão D-02 = B); o `wyd-launcher` aplica o piso
  # de 85% de linha que o plano dele promete (wyd-launcher/docs/planos/plano-de-testes.md
  # §Cobertura). O `--fail-under-lines` vale só no passo de resumo; o LCOV é sempre
  # gerado para o artefato.
  coverage:
    name: cobertura / ${{ matrix.crate }}
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: wyd-db
            args: --lib
            piso: ""
          - crate: wyd-launcher
            args: ""
            piso: --fail-under-lines 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: ${{ matrix.crate }}
      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-llvm-cov
      - name: Cobertura
        run: |
          set -o pipefail
          rustup component add llvm-tools-preview
          cargo llvm-cov --manifest-path crates/${{ matrix.crate }}/Cargo.toml ${{ matrix.args }} --summary-only ${{ matrix.piso }} | tee coverage-summary.txt
          cargo llvm-cov --manifest-path crates/${{ matrix.crate }}/Cargo.toml ${{ matrix.args }} --lcov --output-path lcov.info
      - name: Publicar resumo e LCOV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-${{ matrix.crate }}
          path: |
            coverage-summary.txt
            lcov.info
          retention-days: 7
          if-no-files-found: error

  gate-code:
    name: gate-code
    if: always()
    needs: [fmt, verify, esqueleto, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate-agregado
        with:
          jobs: fmt=${{ needs.fmt.result }} verify=${{ needs.verify.result }} esqueleto=${{ needs.esqueleto.result }} coverage=${{ needs.coverage.result }}

  pg:
    name: pg / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: schema
            alvo: sistema_pg
            papeis: nologin
            serie: true
            usuario: postgres
            url: postgres://postgres:test@127.0.0.1:5432/wyd
          - mode: reversibility
            alvo: reversibilidade_pg
            papeis: nologin
            serie: false
            usuario: postgres
            url: postgres://postgres:test@127.0.0.1:5432/wyd
          - mode: runner
            alvo: runner_pg
            papeis: migrator
            serie: false
            usuario: wyd_migrator
            url: postgres://wyd_migrator:test@127.0.0.1:5432/wyd
    services:
      postgres:
        image: postgres:17@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wyd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wyd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: wyd-db
      - uses: ./.github/actions/testes-pg
        with:
          alvo: ${{ matrix.alvo }}
          url: ${{ matrix.url }}
          papeis: ${{ matrix.papeis }}
          serie: ${{ matrix.serie }}
          usuario: ${{ matrix.usuario }}

  gate-db:
    name: gate-db
    if: always()
    needs: [pg]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate-agregado
        with:
          jobs: pg=${{ needs.pg.result }}

  verificar:
    name: gate-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: wyd-docs/requirements.txt
      - name: Gate do site (inclui testes dos verificadores)
        uses: ./.github/actions/docs-check
      - name: Guardar artefato
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: wyd-docs/site

  publicar:
    name: publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  analise:
    name: audit e deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          crate: wyd-db
      - name: Instalar cargo-audit e cargo-deny
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (cada lockfile)
        run: |
          set -euo pipefail
          for lock in crates/*/Cargo.lock; do
            echo "== $lock"
            cargo audit --file "$lock"
          done
      - name: cargo deny (cada crate)
        run: |
          set -euo pipefail
          for manifest in crates/*/Cargo.toml; do
            echo "== $manifest"
            cargo deny --config wyd-ops/deny.toml --manifest-path "$manifest" check advisories bans licenses sources
          done

  # O portal é Next.js com lockfile versionado e não passava por nenhum job: uma
  # dependência vulnerável ali só apareceria na máquina de quem rodasse `npm audit`.
  portal:
    name: dependências do portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wyd-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node do runner
        run: node --version
      - name: npm audit (produção)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (completo, informativo)
        run: npm audit --audit-level=high || true

  # Regra que o actionlint não cobre: action por SHA de 40 hex e imagem de terceiro
  # por digest. Roda em todo PR para não deixar passar referência móvel.
  pinos:
    name: política de pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir actions e imagens
        run: bash wyd-ops/scripts/ci/check-pins.sh "$GITHUB_WORKSPACE"

  dependency-review:
    name: revisão de dependência
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  workflow-lint:
    name: lint de workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/*.yml

  gate-security:
    name: gate-security
    if: always()
    needs: [analise, portal, pinos, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `dependency-review` só existe em pull_request: o agregado o ignora em push e
      # em schedule, que é o comportamento que o laço antigo tinha à mão.
      - uses: ./.github/actions/gate-agregado
        with:
          jobs: analise=${{ needs.analise.result }} portal=${{ needs.portal.result }} pinos=${{ needs.pinos.result }} dependency-review=${{ needs.dependency-review.result }} workflow-lint=${{ needs.workflow-lint.result }}
          evento: ${{ github.event_name }}
          condicional: dependency-review

  imagem-docs:
    name: construir e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/imagem
        with:
          nome: ${{ env.IMAGE }}
          dockerfile: wyd-ops/wyd-docs.Dockerfile
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:latest
          publicar: ${{ env.PUBLISH_IMAGE }}
          cache-scope: docs-image
          smoke-porta: "8000"
          smoke-caminho: /

  imagem:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: wyd-server
            dockerfile: wyd-ops/wyd-server.Dockerfile
            porta: "7100"
            caminho: /health
            escopo: wyd-server
          - nome: wyd-admin
            dockerfile: wyd-ops/wyd-admin.Dockerfile
            porta: "7600"
            caminho: /health
            escopo: wyd-admin
          - nome: wyd-portal
            dockerfile: wyd-ops/wyd-portal.Dockerfile
            porta: "3000"
            caminho: /
            escopo: wyd-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/imagem
        with:
          nome: ${{ env.REGISTRO }}/${{ matrix.nome }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ env.REGISTRO }}/${{ matrix.nome }}:${{ github.sha }}
            ${{ env.REGISTRO }}/${{ matrix.nome }}:dev
          publicar: ${{ env.PUBLICAR }}
          cache-scope: ${{ matrix.escopo }}
          smoke-porta: ${{ matrix.porta }}
          smoke-caminho: ${{ matrix.caminho }}

  # Último estágio do run: um aviso por run, agregando todos os jobs.
  notificar:
    name: notificar resultado
    if: always()
    needs: [gate-code, gate-db, verificar, gate-security, imagem-docs, imagem]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resultado
        with:
          workflow: ci
