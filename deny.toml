# Política do `cargo deny` — D-02 = B (2026-11-24).
# Bloqueia advisory, licença fora da lista, fonte desconhecida e dependência com `*`.
# Dono da decisão: `planejamento-1.0.0/wyd-ops/docs/prioridade-do-projeto.md` §0.1 (D-02).
# Uso no CI: `.github/workflows/code.yml`, job `security`.

[advisories]
# Nenhum advisory ignorado: qualquer RUSTSEC ativo derruba o job.
ignore = []

[licenses]
# Lista permissiva mínima; licença fora dela derruba o job.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
# O crate é `publish = false`; a checagem de licença vale para as dependências.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
