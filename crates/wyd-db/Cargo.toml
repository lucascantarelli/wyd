# Primeiro slice do crate (Q-BLK-18 = A, 2026-11-24), agora com o runner de migrations.
# `sqlx` fica confinado ao adapter de `migrate/`; as demais camadas usam apenas std, sha2 e thiserror.
# A decisão de features continua documentada em docs/guia-desenvolvedor/mapa-do-crate.md §"o que não decide".
[package]
name = "wyd-db"
version = "0.0.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[[test]]
name = "sistema_pg"
path = "tests/sistema_pg.rs"

[[test]]
name = "reversibilidade_pg"
path = "tests/reversibilidade_pg.rs"

[[test]]
name = "runner_pg"
path = "tests/runner_pg.rs"

[dependencies]
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
