# Primeiro módulo do launcher: verificação do manifesto do patch.
# Escopo de `LCLI-02` (decidida em conteúdo em 2026-11-25, opção A) e do ADR-LCH-0001.
# Sem assinatura e sem canonização ainda: `LLCH-01`/`LLCH-03` entram antes do release.
[package]
name = "wyd-launcher"
version = "0.0.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
